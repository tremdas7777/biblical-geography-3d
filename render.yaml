# Deploy: https://dashboard.render.com → New → Blueprint
# Ou: New → Web Service → repo completo (sem Root Directory)
services:
  - type: web
    name: bg3d-analytics
    runtime: node
    buildCommand: cd server && npm install
    startCommand: cd server && npm start
    envVars:
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: NODE_VERSION
        value: 20
