# Deploy no Render: https://render.com
# New → Web Service → conecte o repo → Root Directory: server
services:
  - type: web
    name: bg3d-analytics
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: NODE_VERSION
        value: 20
